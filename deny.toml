# cargo-deny: licence, ban and source policy for the dependency tree.
#
# RustSec advisories are scanned by cargo-audit (.github/workflows/rust-audit.yml),
# so this file has no [advisories] section.
#
# Run locally with `make deny`.

[graph]
all-features = true

# Permissive licences, plus MPL-2.0 (file-level copyleft, used by dependencies). Copyleft and
# source-available licences are excluded by omission.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8
# The list is the policy, not a census of this tree.
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

# crates.io only.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
