<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="how-it-works-title how-it-works-desc" aria-label="The link is copied; first-bite decodes the copy and publishes it">
<title id="how-it-works-title">The link is copied; first-bite decodes the copy and publishes it</title>
<desc id="how-it-works-desc">Two native systems exchange binary messages on a link. A tap or a switch mirror port sends a copy of every frame one way to first-bite, which captures it, decodes it against a dictionary of JSON files and publishes one JSON record per message on a ZeroMQ PUB socket. Object storage, an HTTP endpoint, a Zenoh data fabric, a Cursor-on-Target transform and any other subscriber read the records. Nothing is sent back to the link, so the native systems are not delayed, blocked or altered.</desc>
