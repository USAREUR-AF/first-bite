<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="three-projects-title three-projects-desc" aria-label="Three ways from a sensor&#x27;s own format to a Zenoh data fabric">
<title id="three-projects-title">Three ways from a sensor&#x27;s own format to a Zenoh data fabric</title>
<desc id="three-projects-desc">A sensor that speaks its own binary format on the left and a Zenoh data fabric on the right, with three projects between them. Open Billie is an endpoint the sensor sends to: it decodes one sensor&#x27;s tracks and publishes them as Cursor-on-Target, ASTERIX CAT062 or SAPIENT. octo-pod is a boundary appliance the sensor sends to: it carries the bytes unchanged under a certificate, a release gate and an audit record. first-bite listens on a tap beside the link, without the sensor knowing, decodes every message and publishes every field as the source defined it.</desc>
<style>text{font-family:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif}.m{font-family:Menlo, Consolas, "Liberation Mono", "Courier New", monospace}.t{fill:#16191f}.q{fill:#515a66}.a{fill:#1f4fbf}.g{fill:#24703a}.w{fill:#8a5300}.i{fill:#5b4bb0}.mu{fill:#5a606a}.on{fill:#ffffff}.bg{fill:#ffffff;stroke:#dfe3e8;stroke-width:1}.bx{fill:#ffffff;stroke:#7d8899;stroke-width:1.25}.bxp{fill:#f4f6f8;stroke:#dfe3e8;stroke-width:1.25}.bxa{fill:#e6edfb;stroke:#1f4fbf;stroke-width:1.25}.bxg{fill:#e3f4e7;stroke:#24703a;stroke-width:1.25}.bxw{fill:#fcefd6;stroke:#8a5300;stroke-width:1.25}.bxm{fill:#eeeeec;stroke:#5a606a;stroke-width:1.25;stroke-dasharray:2 4}.bxd{fill:#ffffff;stroke:#7d8899;stroke-width:1.25;stroke-dasharray:5 4}.ln{stroke:#7d8899;stroke-width:1.25;fill:none}.lnk{stroke:#16191f;stroke-width:3;fill:none}.lna{stroke:#1f4fbf;stroke-width:2;fill:none}.lnd{stroke:#7d8899;stroke-width:1.25;fill:none;stroke-dasharray:6 5}.lnr{stroke:#dfe3e8;stroke-width:1;fill:none}.fa{fill:#1f4fbf}.fl{fill:#7d8899}.fk{fill:#16191f}.fg{fill:#24703a}.fp{fill:#f4f6f8}.fr{fill:#dfe3e8}.f0{fill:#e6edfb}.f1{fill:#fcefd6}.f2{fill:#eeebfa}.f3{fill:#e3f4e7}.s0{stroke:#1f4fbf}.s1{stroke:#8a5300}.s2{stroke:#5b4bb0}.s3{stroke:#24703a}.c0{fill:#1f4fbf}.c1{fill:#8a5300}.c2{fill:#5b4bb0}.c3{fill:#24703a}.pp{fill:#ffffff}path,line{stroke-linejoin:round}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="371" rx="12"/>
<text x="24" y="38" font-size="18" font-weight="700" data-role="title" class="t">Three ways from a sensor&#x27;s own format to a Zenoh data fabric</text>
<rect x="24" y="64" width="100" height="284" rx="8" class="bx"/>
<text x="74" y="192.5" font-size="15" font-weight="700" text-anchor="middle" class="t">Sensor</text>
<text x="74" y="210.9" font-size="13" text-anchor="middle" class="q">its own</text>
<text x="74" y="228.9" font-size="13" text-anchor="middle" class="q">binary format</text>
<rect x="636" y="64" width="100" height="284" rx="8" class="bx"/>
<text x="686" y="201.5" font-size="15" font-weight="700" text-anchor="middle" class="t">Zenoh</text>
<text x="686" y="219.9" font-size="13" text-anchor="middle" class="q">data fabric</text>
<rect x="220" y="64" width="350" height="84" rx="8" class="bx"/>
<text x="395" y="92.5" font-size="15" font-weight="700" text-anchor="middle" class="t">Open Billie</text>
<text x="395" y="110.9" font-size="13" text-anchor="middle" class="t">an endpoint: turns one sensor&#x27;s tracks into</text>
<text x="395" y="128.9" font-size="13" text-anchor="middle" class="q">Cursor-on-Target, ASTERIX CAT062 or SAPIENT</text>
<path d="M124 106L211 106" class="ln"/><path d="M220 106L210 111L210 101z" class="fl"/>
<text x="170" y="96" font-size="13" text-anchor="middle" class="q">sends</text>
<path d="M570 106L627 106" class="ln"/><path d="M636 106L626 111L626 101z" class="fl"/>
<text x="602" y="96" font-size="13" text-anchor="middle" class="q">tracks</text>
<rect x="220" y="164" width="350" height="84" rx="8" class="bx"/>
<text x="395" y="192.5" font-size="15" font-weight="700" text-anchor="middle" class="t">octo-pod</text>
<text x="395" y="210.9" font-size="13" text-anchor="middle" class="t">a boundary appliance: carries bytes unchanged,</text>
<text x="395" y="228.9" font-size="13" text-anchor="middle" class="q">under a certificate, a release gate, an audit record</text>
<path d="M124 206L211 206" class="ln"/><path d="M220 206L210 211L210 201z" class="fl"/>
<text x="170" y="196" font-size="13" text-anchor="middle" class="q">sends</text>
<path d="M570 206L627 206" class="ln"/><path d="M636 206L626 211L626 201z" class="fl"/>
<text x="602" y="196" font-size="13" text-anchor="middle" class="q">bytes</text>
<rect x="220" y="264" width="350" height="84" rx="8" class="bx"/>
<text x="395" y="292.5" font-size="15" font-weight="700" text-anchor="middle" class="a">first-bite</text>
<text x="395" y="310.9" font-size="13" text-anchor="middle" class="t">a passive listener: decodes every message,</text>
<text x="395" y="328.9" font-size="13" text-anchor="middle" class="q">every field named as the source defined it</text>
<path d="M124 306L150 306" class="lna" data-lint="nohead"/>
<rect x="150" y="290" width="44" height="32" rx="6" class="bx"/>
<text x="172" y="309.9" font-size="13" font-weight="700" text-anchor="middle" class="t">tap</text>
<path d="M194 306L211 306" class="lna"/><path d="M220 306L210 311L210 301z" class="fa"/>
<text x="172" y="280" font-size="13" text-anchor="middle" class="q">copy</text>
<path d="M570 306L627 306" class="lna"/><path d="M636 306L626 311L626 301z" class="fa"/>
<text x="602" y="296" font-size="13" text-anchor="middle" class="q">records</text>
</svg>
