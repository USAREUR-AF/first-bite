<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" role="img" aria-labelledby="components-title components-desc" aria-label="Six crates: frames go in on the left, records come out on the right">
<title id="components-title">Six crates: frames go in on the left, records come out on the right</title>
<desc id="components-desc">Frames come from a network interface, a capture file or a UDP socket into the mind binary. Its source hands each frame to its pipeline, which passes the payload to the bite library; bite decodes it against the dictionary and returns typed fields. The pipeline hands a record to the flow library, whose ZeroMQ publisher feeds sinks and transforms; the Cursor-on-Target transform uses the cotify library. The datamodels crate holds the record type and logger the log format.</desc>
