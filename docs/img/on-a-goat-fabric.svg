<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="on-a-goat-fabric-title on-a-goat-fabric-desc" aria-label="first-bite is a way onto a goat data fabric, not another fabric">
<title id="on-a-goat-fabric-title">first-bite is a way onto a goat data fabric, not another fabric</title>
<desc id="on-a-goat-fabric-desc">With the optional goat feature, first-bite reads a copy of a link from a tap or mirror port, decodes it from a dictionary and publishes records as a Zenoh client holding a certificate the goatnet issued. The goat data fabric owns identity, access rules, routing and delivery, and consumers read from the fabric, not from first-bite. Records land on &lt;prefix&gt;/telemetry/&lt;format&gt;/&lt;site&gt;/&lt;interface&gt;/&lt;message&gt;, with a schema declared at attest/schema/&lt;record key&gt; and an announcement under &lt;prefix&gt;/services/shims. Without goat, which is the default build, the same decoder publishes on a ZeroMQ socket to object storage, HTTP, a file or any Zenoh router.</desc>
<style>text{font-family:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif}.m{font-family:Menlo, Consolas, "Liberation Mono", "Courier New", monospace}.t{fill:#16191f}.q{fill:#515a66}.a{fill:#1f4fbf}.g{fill:#24703a}.w{fill:#8a5300}.i{fill:#5b4bb0}.mu{fill:#5a606a}.on{fill:#ffffff}.bg{fill:#ffffff;stroke:#dfe3e8;stroke-width:1}.bx{fill:#ffffff;stroke:#7d8899;stroke-width:1.25}.bxp{fill:#f4f6f8;stroke:#dfe3e8;stroke-width:1.25}.bxa{fill:#e6edfb;stroke:#1f4fbf;stroke-width:1.25}.bxg{fill:#e3f4e7;stroke:#24703a;stroke-width:1.25}.bxw{fill:#fcefd6;stroke:#8a5300;stroke-width:1.25}.bxm{fill:#eeeeec;stroke:#5a606a;stroke-width:1.25;stroke-dasharray:2 4}.bxd{fill:#ffffff;stroke:#7d8899;stroke-width:1.25;stroke-dasharray:5 4}.ln{stroke:#7d8899;stroke-width:1.25;fill:none}.lnk{stroke:#16191f;stroke-width:3;fill:none}.lna{stroke:#1f4fbf;stroke-width:2;fill:none}.lnd{stroke:#7d8899;stroke-width:1.25;fill:none;stroke-dasharray:6 5}.lnr{stroke:#dfe3e8;stroke-width:1;fill:none}.fa{fill:#1f4fbf}.fl{fill:#7d8899}.fk{fill:#16191f}.fg{fill:#24703a}.fp{fill:#f4f6f8}.fr{fill:#dfe3e8}.f0{fill:#e6edfb}.f1{fill:#fcefd6}.f2{fill:#eeebfa}.f3{fill:#e3f4e7}.s0{stroke:#1f4fbf}.s1{stroke:#8a5300}.s2{stroke:#5b4bb0}.s3{stroke:#24703a}.c0{fill:#1f4fbf}.c1{fill:#8a5300}.c2{fill:#5b4bb0}.c3{fill:#24703a}.pp{fill:#ffffff}path,line{stroke-linejoin:round}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="469" rx="12"/>
<text x="24" y="38" font-size="18" font-weight="700" data-role="title" class="t">first-bite is a way onto a goat data fabric, not another fabric</text>
<text x="24" y="74" font-size="13" font-weight="700" data-role="note" class="q">With the goat feature: optional, off by default</text>
<rect x="24" y="86" width="110" height="118" rx="8" class="bx"/>
<text x="79" y="131.2" font-size="14" font-weight="700" text-anchor="middle" class="t">Equipment</text>
<text x="79" y="149.4" font-size="13" text-anchor="middle" class="q">its own binary</text>
<text x="79" y="167.4" font-size="13" text-anchor="middle" class="q">format, on a link</text>
<path d="M134 145L177 145" class="lna"/><path d="M186 145L176 150L176 140z" class="fa"/>
<text x="158" y="135" font-size="13" text-anchor="middle" class="q">copy</text>
<rect x="186" y="86" width="214" height="118" rx="8" class="bxa"/>
<text x="202" y="110" font-size="15" font-weight="700" class="a">first-bite</text>
<text x="202" y="132" font-size="13" class="t">capture: tap or mirror port</text>
<text x="202" y="151" font-size="13" class="t">decode: from a dictionary</text>
<text x="202" y="170" font-size="13" class="t">publish: as a Zenoh client</text>
<text x="202" y="189" font-size="13" class="q">certificate: from the goatnet</text>
<path d="M400 145L461 145" class="lna"/><path d="M470 145L460 150L460 140z" class="fa"/>
<text x="434" y="135" font-size="13" text-anchor="middle" class="q">records</text>
<rect x="470" y="86" width="266" height="118" rx="8" class="bx"/>
<text x="486" y="110" font-size="15" font-weight="700" class="t">goat data fabric</text>
<text x="486" y="132" font-size="13" class="t">identity: its certificate authority</text>
<text x="486" y="151" font-size="13" class="t">access: only under a granted prefix</text>
<text x="486" y="170" font-size="13" class="t">routing: Zenoh routers on its mesh</text>
<text x="486" y="189" font-size="13" class="t">delivery: to subscribers</text>
<path d="M603 204L603 219" class="ln"/><path d="M603 228L598 218L608 218z" class="fl"/>
<rect x="470" y="228" width="266" height="50" rx="8" class="bx"/>
<text x="603" y="247.9" font-size="13" font-weight="700" text-anchor="middle" class="t">Consumers</text>
<text x="603" y="265.9" font-size="13" text-anchor="middle" class="q">read from the fabric, not from first-bite</text>
<text x="24" y="240" font-size="13" data-role="note" class="t" xml:space="preserve"><tspan class="a" font-weight="700">first-bite: </tspan><tspan class="t">from the wire to a record</tspan></text>
<text x="24" y="262" font-size="13" data-role="note" class="t" xml:space="preserve"><tspan class="t" font-weight="700">goat: </tspan><tspan class="t">who may publish, under which keys, and where it goes</tspan></text>
<rect x="24" y="288" width="712" height="74" rx="8" class="bxp"/>
<text x="40" y="310" font-size="13" font-weight="700" class="q">Records</text>
<text x="150" y="310" font-size="13" class="t m">&lt;prefix&gt;/telemetry/&lt;format&gt;/&lt;site&gt;/&lt;interface&gt;/&lt;message&gt;</text>
<text x="40" y="330" font-size="13" font-weight="700" class="q">Schema</text>
<text x="150" y="330" font-size="13" class="t m">attest/schema/&lt;record key&gt;</text>
<text x="40" y="350" font-size="13" font-weight="700" class="q">Announcement</text>
<text x="150" y="350" font-size="13" class="t m">&lt;prefix&gt;/services/shims/&lt;format&gt;/&lt;instance&gt;/announce</text>
<text x="720" y="330" font-size="13" text-anchor="end" class="q">&lt;prefix&gt; is the granted identity</text>
<text x="24" y="392" font-size="13" font-weight="700" data-role="note" class="q">Without goat: the default build</text>
<rect x="24" y="404" width="130" height="48" rx="8" class="bxa"/>
<text x="89" y="423.2" font-size="14" font-weight="700" text-anchor="middle" class="a">first-bite</text>
<text x="89" y="441.4" font-size="13" text-anchor="middle" class="q">the same decoder</text>
<path d="M154 428L181 428" class="lna"/><path d="M190 428L180 433L180 423z" class="fa"/>
<rect x="190" y="404" width="170" height="48" rx="8" class="bx"/>
<text x="275" y="423.2" font-size="14" font-weight="700" text-anchor="middle" class="t">ZeroMQ PUB socket</text>
<text x="275" y="441.4" font-size="13" text-anchor="middle" class="q">on this host</text>
<path d="M360 428L387 428" class="lna"/><path d="M396 428L386 433L386 423z" class="fa"/>
<rect x="396" y="404" width="340" height="48" rx="8" class="bx"/>
<text x="566" y="423.2" font-size="14" font-weight="700" text-anchor="middle" class="t">Sinks</text>
<text x="566" y="441.4" font-size="13" text-anchor="middle" class="q">object storage, HTTP, a file, any Zenoh router</text>
</svg>
