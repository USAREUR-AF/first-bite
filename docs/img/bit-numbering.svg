<text x="60" y="254" font-size="13" data-role="note" class="t" xml:space="preserve"><tspan class="t">A document with bit 0 most significant calls the same field </tspan><tspan class="a" font-weight="700">bits 3-10</tspan></text>
<text x="60" y="310" font-size="13" data-role="note" class="t" xml:space="preserve"><tspan class="t">The dictionary counts from the first bit of the payload: </tspan><tspan class="a" font-weight="700">start 35, stop 43</tspan><tspan class="q"> (the first bit after the field)</tspan></text>
<rect x="24" y="336" width="712" height="122" rx="8" class="bxp"/>
<text x="40" y="364" font-size="13" font-weight="700" class="t">start</text>
<text x="92" y="364" font-size="13" class="t">= (word - first word) x word size + bits above the field in its word</text>
<text x="92" y="386" font-size="13" class="t m">= (3 - 1) x 16 + (15 - 12) = 35</text>
<text x="430" y="386" font-size="13" class="t m">stop = start + width = 35 + 8 = 43</text>
<path d="M40 402L720 402" class="lnr" data-lint="nohead"/>
<text x="40" y="428" font-size="13" class="a m">bite range --word-bits 16 --bit0 lsb --first-word 1 --word 3 --bits 12-5</text>
<text x="40" y="446" font-size="13" class="q">does the arithmetic and draws the word</text>
