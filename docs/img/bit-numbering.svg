<text x="24" y="38" font-size="18" font-weight="700" data-role="title" class="t">&quot;Word 3, bits 12-5&quot; is bits [35, 43) of the payload</text>
<text x="60" y="66" font-size="13" data-role="note" class="q">Word 3 of a message: 16-bit words, numbered from 1, most significant byte first</text>
<text x="60" y="96" font-size="13" data-role="note" class="t" xml:space="preserve"><tspan class="t">The document, bit 0 least significant: </tspan><tspan class="a" font-weight="700">bits 12-5</tspan></text>
