<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" role="img" aria-labelledby="where-it-fits-title where-it-fits-desc" aria-label="first-bite brings old systems onto the goat data fabric">
<title id="where-it-fits-title">first-bite brings old systems onto the goat data fabric</title>
<desc id="where-it-fits-desc">Old systems, unchanged, are read by first-bite, which publishes onto the goat data fabric. New systems join the fabric directly. People and programs with access use the data from the fabric. first-bite also runs with no goat at all.</desc>
<style>text{font-family:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif}.m{font-family:Menlo, Consolas, "Liberation Mono", "Courier New", monospace}.t{fill:#16191f}.q{fill:#515a66}.a{fill:#1f4fbf}.g{fill:#24703a}.w{fill:#8a5300}.i{fill:#5b4bb0}.mu{fill:#5a606a}.on{fill:#ffffff}.bg{fill:#ffffff;stroke:#dfe3e8;stroke-width:1}.bx{fill:#ffffff;stroke:#7d8899;stroke-width:1.25}.bxp{fill:#f4f6f8;stroke:#dfe3e8;stroke-width:1.25}.bxa{fill:#e6edfb;stroke:#1f4fbf;stroke-width:1.25}.bxg{fill:#e3f4e7;stroke:#24703a;stroke-width:1.25}.bxw{fill:#fcefd6;stroke:#8a5300;stroke-width:1.25}.bxm{fill:#eeeeec;stroke:#5a606a;stroke-width:1.25;stroke-dasharray:2 4}.bxd{fill:#ffffff;stroke:#7d8899;stroke-width:1.25;stroke-dasharray:5 4}.ln{stroke:#7d8899;stroke-width:1.25;fill:none}.lnk{stroke:#16191f;stroke-width:3;fill:none}.lna{stroke:#1f4fbf;stroke-width:2;fill:none}.lnd{stroke:#7d8899;stroke-width:1.25;fill:none;stroke-dasharray:6 5}.lnr{stroke:#dfe3e8;stroke-width:1;fill:none}.fa{fill:#1f4fbf}.fl{fill:#7d8899}.fk{fill:#16191f}.fg{fill:#24703a}.fp{fill:#f4f6f8}.fr{fill:#dfe3e8}.f0{fill:#e6edfb}.f1{fill:#fcefd6}.f2{fill:#eeebfa}.f3{fill:#e3f4e7}.s0{stroke:#1f4fbf}.s1{stroke:#8a5300}.s2{stroke:#5b4bb0}.s3{stroke:#24703a}.c0{fill:#1f4fbf}.c1{fill:#8a5300}.c2{fill:#5b4bb0}.c3{fill:#24703a}.pp{fill:#ffffff}path,line{stroke-linejoin:round}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="211" rx="12"/>
<rect x="416" y="16" width="160" height="48" rx="8" class="bx"/>
<text x="496" y="46.6" font-size="22" font-weight="700" text-anchor="middle" class="t">New systems</text>
<path d="M496 64L496 83" class="ln"/><path d="M496 92L491 82L501 82z" class="fl"/>
<text x="590" y="47" font-size="20" class="q">join directly</text>
<rect x="24" y="92" width="166" height="78" rx="8" class="bx"/>
<text x="107" y="125.1" font-size="22" font-weight="700" text-anchor="middle" class="t">Old systems</text>
<text x="107" y="150.5" font-size="20" text-anchor="middle" class="q">unchanged</text>
<path d="M190 131L217 131" class="lna"/><path d="M226 131L216 136L216 126z" class="fa"/>
<rect x="226" y="92" width="154" height="78" rx="8" class="bxa"/>
<text x="303" y="125.1" font-size="22" font-weight="700" text-anchor="middle" class="a">first-bite</text>
<text x="303" y="150.5" font-size="20" text-anchor="middle" class="q">listens</text>
<path d="M380 131L407 131" class="lna"/><path d="M416 131L406 136L406 126z" class="fa"/>
<rect x="416" y="92" width="160" height="78" rx="8" class="bxp"/>
<text x="496" y="125.7" font-size="24" font-weight="700" text-anchor="middle" class="t">goat</text>
<text x="496" y="151.5" font-size="20" text-anchor="middle" class="q">data fabric</text>
<path d="M576 131L603 131" class="ln"/><path d="M612 131L602 136L602 126z" class="fl"/>
<rect x="612" y="80" width="124" height="102" rx="8" class="bx"/>
<text x="674" y="112" font-size="20" font-weight="700" text-anchor="middle" class="t">People,</text>
<text x="674" y="137" font-size="20" font-weight="700" text-anchor="middle" class="t">programs</text>
<text x="674" y="162" font-size="20" text-anchor="middle" class="q">with access</text>
<text x="24" y="198" font-size="20" data-role="note" class="q">Without goat, first-bite still runs on its own.</text>
</svg>
