<rect class="bg" x="0.5" y="0.5" width="759" height="285" rx="12"/>
<text x="24" y="38" font-size="18" font-weight="700" data-role="title" class="t">An interface document becomes data that every tool runs from</text>
<rect x="24" y="86" width="160" height="120" rx="8" class="bx"/>
<text x="104" y="132.2" font-size="14" font-weight="700" text-anchor="middle" class="t">Interface document</text>
<text x="104" y="150.4" font-size="13" text-anchor="middle" class="q">hundreds of pages</text>
<text x="104" y="168.4" font-size="13" text-anchor="middle" class="q">of tables, in a PDF</text>
<rect x="254" y="60" width="208" height="172" rx="8" class="bxa"/>
<text x="270" y="86" font-size="15" font-weight="700" class="a">Dictionary</text>
<text x="270" y="112" font-size="13" class="t">one JSON file per message</text>
<text x="270" y="132" font-size="13" class="t">bit ranges and types</text>
<text x="270" y="152" font-size="13" class="t">scale, units and labels</text>
<text x="270" y="172" font-size="13" class="t">test vectors</text>
<text x="270" y="192" font-size="13" class="q">versioned, reviewed, diffed</text>
