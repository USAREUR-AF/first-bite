<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" role="img" aria-labelledby="icd-to-dictionary-title icd-to-dictionary-desc" aria-label="An interface document becomes data that every tool runs from">
<title id="icd-to-dictionary-title">An interface document becomes data that every tool runs from</title>
<desc id="icd-to-dictionary-desc">An interface control document, hundreds of pages of tables in a PDF, is transcribed into a dictionary: one JSON file per message giving bit ranges, types, scale, units and labels, kept under version control and reviewed like code. Four things run from that one source: the decoder, bite check with the test vectors, a generated JSON Schema, and the bit view in a browser. All four and the dictionary format are built. A documented method and tooling for the transcription step are in progress.</desc>
