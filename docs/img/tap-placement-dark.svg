<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" role="img" aria-labelledby="tap-placement-title tap-placement-desc" aria-label="Where the copy is taken decides what can be lost">
<title id="tap-placement-title">Where the copy is taken decides what can be lost</title>
<desc id="tap-placement-desc">Four ways to give first-bite a copy of a link. A breakout tap has one monitor port per direction, so first-bite uses two capture interfaces; the link is not affected and nothing is lost at the tap; built and measured. An aggregating tap merges both directions into one port, with the same effect and loss; built and measured. A switch mirror port (SPAN) does not affect forwarding, carries both directions on one port, and the switch drops mirrored frames first when it is busy; built. A remote mirror sends each frame in a GRE, ERSPAN or VXLAN tunnel across a routed network to first-bite on any host the session can route to, which unwraps it; it behaves as a mirror port, adds the tunnel&#x27;s traffic to that network and can also lose what the path drops; built, not yet run against a switch.</desc>
