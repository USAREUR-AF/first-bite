<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" role="img" aria-labelledby="where-it-fits-title where-it-fits-desc" aria-label="first-bite brings old systems onto the goat data fabric">
<title id="where-it-fits-title">first-bite brings old systems onto the goat data fabric</title>
<desc id="where-it-fits-desc">Old systems, unchanged, are read by first-bite, which publishes onto the goat data fabric. New systems join the fabric directly. People and programs use the data from the fabric. first-bite also runs with no goat at all.</desc>
<style>text{font-family:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif}.m{font-family:Menlo, Consolas, "Liberation Mono", "Courier New", monospace}.t{fill:#e6e9ee}.q{fill:#a3abb8}.a{fill:#8fb0ff}.g{fill:#6cc487}.w{fill:#e3b04f}.i{fill:#b3a6f5}.mu{fill:#9aa2ad}.on{fill:#0f1317}.bg{fill:#0f1317;stroke:#2c333d;stroke-width:1}.bx{fill:#0f1317;stroke:#7a8594;stroke-width:1.25}.bxp{fill:#171b21;stroke:#2c333d;stroke-width:1.25}.bxa{fill:#172544;stroke:#8fb0ff;stroke-width:1.25}.bxg{fill:#172b1e;stroke:#6cc487;stroke-width:1.25}.bxw{fill:#31281a;stroke:#e3b04f;stroke-width:1.25}.bxm{fill:#23262b;stroke:#9aa2ad;stroke-width:1.25;stroke-dasharray:2 4}.bxd{fill:#0f1317;stroke:#7a8594;stroke-width:1.25;stroke-dasharray:5 4}.ln{stroke:#7a8594;stroke-width:1.25;fill:none}.lnk{stroke:#e6e9ee;stroke-width:3;fill:none}.lna{stroke:#8fb0ff;stroke-width:2;fill:none}.lnd{stroke:#7a8594;stroke-width:1.25;fill:none;stroke-dasharray:6 5}.lnr{stroke:#2c333d;stroke-width:1;fill:none}.fa{fill:#8fb0ff}.fl{fill:#7a8594}.fk{fill:#e6e9ee}.fg{fill:#6cc487}.fp{fill:#171b21}.fr{fill:#2c333d}.f0{fill:#172544}.f1{fill:#31281a}.f2{fill:#221d3d}.f3{fill:#172b1e}.s0{stroke:#8fb0ff}.s1{stroke:#e3b04f}.s2{stroke:#b3a6f5}.s3{stroke:#6cc487}.c0{fill:#8fb0ff}.c1{fill:#e3b04f}.c2{fill:#b3a6f5}.c3{fill:#6cc487}.pp{fill:#0f1317}path,line{stroke-linejoin:round}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="211" rx="12"/>
<rect x="416" y="16" width="176" height="48" rx="8" class="bx"/>
<text x="504" y="46.6" font-size="22" font-weight="700" text-anchor="middle" class="t">New systems</text>
<path d="M504 64L504 83" class="ln"/><path d="M504 92L499 82L509 82z" class="fl"/>
<text x="606" y="47" font-size="20" class="q">join directly</text>
<rect x="24" y="92" width="166" height="78" rx="8" class="bx"/>
<text x="107" y="125.1" font-size="22" font-weight="700" text-anchor="middle" class="t">Old systems</text>
<text x="107" y="150.5" font-size="20" text-anchor="middle" class="q">unchanged</text>
<path d="M190 131L217 131" class="lna"/><path d="M226 131L216 136L216 126z" class="fa"/>
<rect x="226" y="92" width="154" height="78" rx="8" class="bxa"/>
<text x="303" y="125.1" font-size="22" font-weight="700" text-anchor="middle" class="a">first-bite</text>
<text x="303" y="150.5" font-size="20" text-anchor="middle" class="q">listens</text>
<path d="M380 131L407 131" class="lna"/><path d="M416 131L406 136L406 126z" class="fa"/>
<rect x="416" y="92" width="176" height="78" rx="8" class="bxp"/>
<text x="504" y="125.7" font-size="24" font-weight="700" text-anchor="middle" class="t">goat</text>
<text x="504" y="151.5" font-size="20" text-anchor="middle" class="q">data fabric</text>
<path d="M592 131L619 131" class="ln"/><path d="M628 131L618 136L618 126z" class="fl"/>
<rect x="628" y="92" width="108" height="78" rx="8" class="bx"/>
<text x="682" y="124.5" font-size="20" font-weight="700" text-anchor="middle" class="t">People,</text>
<text x="682" y="149.5" font-size="20" font-weight="700" text-anchor="middle" class="t">programs</text>
<text x="24" y="198" font-size="20" data-role="note" class="q">Without goat, first-bite still runs on its own.</text>
</svg>
