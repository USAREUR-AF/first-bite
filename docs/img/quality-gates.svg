<text x="404" y="222" font-size="13" class="t">names, units, labels and sources</text>
<text x="404" y="240" font-size="13" class="t">that depart from the conventions</text>
<path d="M52 248L52 257" class="lna"/><path d="M52 266L47 256L57 256z" class="fa"/>
<rect x="24" y="266" width="296" height="44" rx="8" class="bxa"/>
