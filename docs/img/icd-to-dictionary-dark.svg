<text x="528" y="217" font-size="13" font-weight="700" class="t">Bit view in a browser</text>
<text x="528" y="234" font-size="13" class="q">the same decoder</text>
<text x="24" y="268" font-size="13" data-role="note" class="t" xml:space="preserve"><tspan class="g" font-weight="700">Built: </tspan><tspan class="t">the format and all that runs from it.  </tspan><tspan class="w" font-weight="700">In progress: </tspan><tspan class="t">a documented method and tooling to transcribe.</tspan></text>
