<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" width="760" height="406" role="img" aria-labelledby="one-decode-many-consumers-title one-decode-many-consumers-desc" aria-label="One decode serves every consumer, and none of them touches the link">
<title id="one-decode-many-consumers-title">One decode serves every consumer, and none of them touches the link</title>
<desc id="one-decode-many-consumers-desc">Left, point to point: each of four consumers implements the binary interface and holds its own connection to native system A, so there are four parsers and four connections for A to serve. Right, with a tap: first-bite decodes once and publishes, the four consumers subscribe and read JSON, and there is one decoder and no connection to A or B.</desc>
