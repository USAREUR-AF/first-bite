<text x="404" y="364" font-size="13" class="t">wrong scale or sign, against the document</text>
<path d="M52 372L52 381" class="lna"/><path d="M52 390L47 380L57 380z" class="fa"/>
<rect x="24" y="390" width="256" height="44" rx="8" class="bxp"/>
<text x="38" y="408" font-size="14" font-weight="700" class="t">Second reader</text>
<text x="38" y="426" font-size="13" class="q">review checklist</text>
<path d="M280 412L392 412" class="lnr" data-lint="nohead"/>
<text x="404" y="408" font-size="13" class="t">a value copied wrong</text>
<text x="404" y="426" font-size="13" class="t">that still decodes</text>
<path d="M52 434L52 443" class="lna"/><path d="M52 452L47 442L57 442z" class="fa"/>
<rect x="24" y="452" width="236" height="44" rx="8" class="bxa"/>
<text x="38" y="470" font-size="14" font-weight="700" class="t">Version</text>
<text x="38" y="488" font-size="13" class="q m">bite diff --check-version</text>
<path d="M260 474L392 474" class="lnr" data-lint="nohead"/>
