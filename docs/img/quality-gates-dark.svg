<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" width="760" height="548" role="img" aria-labelledby="quality-gates-title quality-gates-desc" aria-label="Each gate catches a kind of mistake the gates before it cannot see">
<title id="quality-gates-title">Each gate catches a kind of mistake the gates before it cannot see</title>
<desc id="quality-gates-desc">A transcription passes seven gates before it is released, each narrower than the last. bite fmt --check catches two spellings of one definition and a key written twice. bite check --strict catches inverted and overlapping bit ranges and messages named but not defined. bite lint catches names, units, labels and sources that depart from the conventions. bite coverage --strict catches bits no field claims and fields with no source, description or unit. The vectors, run by bite check, catch a field at the wrong bits or with the wrong scale or sign, against the document&#x27;s own examples. A second reader catches a value copied wrong that still decodes. bite diff --check-version catches a breaking change released under a minor version.</desc>
<style>text{font-family:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif}.m{font-family:Menlo, Consolas, "Liberation Mono", "Courier New", monospace}.t{fill:#e6e9ee}.q{fill:#a3abb8}.a{fill:#8fb0ff}.g{fill:#6cc487}.w{fill:#e3b04f}.i{fill:#b3a6f5}.mu{fill:#9aa2ad}.on{fill:#0f1317}.bg{fill:#0f1317;stroke:#2c333d;stroke-width:1}.bx{fill:#0f1317;stroke:#7a8594;stroke-width:1.25}.bxp{fill:#171b21;stroke:#2c333d;stroke-width:1.25}.bxa{fill:#172544;stroke:#8fb0ff;stroke-width:1.25}.bxg{fill:#172b1e;stroke:#6cc487;stroke-width:1.25}.bxw{fill:#31281a;stroke:#e3b04f;stroke-width:1.25}.bxm{fill:#23262b;stroke:#9aa2ad;stroke-width:1.25;stroke-dasharray:2 4}.bxd{fill:#0f1317;stroke:#7a8594;stroke-width:1.25;stroke-dasharray:5 4}.ln{stroke:#7a8594;stroke-width:1.25;fill:none}.lnk{stroke:#e6e9ee;stroke-width:3;fill:none}.lna{stroke:#8fb0ff;stroke-width:2;fill:none}.lnd{stroke:#7a8594;stroke-width:1.25;fill:none;stroke-dasharray:6 5}.lnr{stroke:#2c333d;stroke-width:1;fill:none}.fa{fill:#8fb0ff}.fl{fill:#7a8594}.fk{fill:#e6e9ee}.fg{fill:#6cc487}.fp{fill:#171b21}.fr{fill:#2c333d}.f0{fill:#172544}.f1{fill:#31281a}.f2{fill:#221d3d}.f3{fill:#172b1e}.s0{stroke:#8fb0ff}.s1{stroke:#e3b04f}.s2{stroke:#b3a6f5}.s3{stroke:#6cc487}.c0{fill:#8fb0ff}.c1{fill:#e3b04f}.c2{fill:#b3a6f5}.c3{fill:#6cc487}.pp{fill:#0f1317}path,line{stroke-linejoin:round}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="547" rx="12"/>
<text x="24" y="38" font-size="18" font-weight="700" data-role="title" class="t">Each gate catches a kind of mistake the gates before it cannot see</text>
<text x="24" y="66" font-size="13" font-weight="700" data-role="note" class="t">a transcription, as typed</text>
<text x="404" y="66" font-size="13" class="q">catches</text>
<rect x="24" y="80" width="356" height="44" rx="8" class="bxa"/>
<text x="38" y="98" font-size="14" font-weight="700" class="t">Format</text>
<text x="38" y="116" font-size="13" class="q m">bite fmt --check</text>
<path d="M380 102L392 102" class="lnr" data-lint="nohead"/>
<text x="404" y="98" font-size="13" class="t">two spellings of one definition;</text>
<text x="404" y="116" font-size="13" class="t">a key written twice</text>
<path d="M52 124L52 133" class="lna"/><path d="M52 142L47 132L57 132z" class="fa"/>
