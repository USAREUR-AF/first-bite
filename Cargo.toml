[workspace]
resolver = "2"
members = [
    "bite",
    "bite-wasm",
    "cotify",
    "datamodels",
    "flow",
    "logger",
    "mind",
]
# The fuzz targets are their own workspace: they need a nightly toolchain and
# are built by `cargo fuzz` (fuzz/README.md), never by a workspace build.
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/USAREUR-AF/first-bite"
# The crates are built from this workspace, not published to crates.io.
publish = false

[workspace.dependencies]
bite = { path = "bite" }
cotify = { path = "cotify" }
datamodels = { path = "datamodels" }
flow = { path = "flow" }
logger = { path = "logger" }

async-trait = "0.1"
# No `default-https-client`: the S3 sink's HTTP client is built in
# flow/src/security/ from the same TLS configuration as every other sink.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
# The crypto library behind the rustls provider; named here for the request
# signature of the Azure sink and for the version and FIPS-mode queries.
aws-lc-rs = { version = "1.19", default-features = false }
base64 = "0.23"
chrono = "0.4"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
colored = "3"
ctrlc = { version = "3", features = ["termination"] }
dotenvy = "0.15"
env_logger = "0.11"
etherparse = "0.21"
# The `xf` transform of flow (optional feature `goat-transformers`). The crate
# is not on crates.io: it is taken from its public repository at one commit,
# which deny.toml allows as the only git source. It has no dependencies.
# flow/xf/UPSTREAM names the same commit; tools/bite2pack/refresh.sh checks it.
goat-transformers = { git = "https://github.com/USAREUR-AF/goat-transformers", rev = "2d4c784dea0e3ef4552b80d6bf79754e9e3f3311" }
hex = "0.4"
hmac = "0.13"
libc = "0.2"
log = "0.4"
pcap = "2"
quick-xml = "0.42"
# Test certificates, made when the tests run: no key is kept in the tree.
rcgen = "0.14"
# `-no-provider`: reqwest brings no crypto library of its own; the TLS
# configuration it is handed carries the process's one provider.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-manual-roots-no-provider"] }
# The one TLS library and, through `aws_lc_rs`, the one crypto provider.
rustls = { version = "0.23.22", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
# Certificate checks for the optional `goat` feature: these two and
# x509-parser are already built by the Zenoh TLS transport, at these versions.
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
webpki-roots = "1"
x509-parser = "0.18"
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp", "transport_tls"] }
zmq = "0.10"

# Optimised dependencies and line-only debug info keep debug builds fast to
# link without making the pipeline too slow to exercise.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
