[package]
name = "bite-wasm"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "the bite decoder as a WebAssembly module for browsers"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The library only: the command line is not part of the module.
bite = { path = "../bite", default-features = false }
hex.workspace = true
serde_json.workspace = true

# The bindings exist only in the WebAssembly build; a native build compiles
# the layer under them (src/api.rs) and its tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
