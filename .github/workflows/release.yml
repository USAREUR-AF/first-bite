# Builds the release for a v* tag and publishes it: a GitHub release and a
# container image.
#
# Release assets:
#   first-bite-<version>-x86_64-linux-gnu.tar.gz
#   first-bite-<version>-aarch64-linux-gnu.tar.gz
#       the standard Linux build: needs glibc 2.31 (Ubuntu 20.04) or later
#       and nothing else. mind carries the Zenoh sink (RELEASE_FEATURES in
#       the Makefile), as do the fips and macOS builds; the musl build does not
#   first-bite-<version>-x86_64-linux-musl.tar.gz
#   first-bite-<version>-aarch64-linux-musl.tar.gz
#       the self-contained Linux build: fully static. Built only for a
#       vX.Y.0 tag, or by workflow_dispatch with the input `static`
#   first-bite-<version>-x86_64-linux-gnu-fips.tar.gz
#   first-bite-<version>-aarch64-linux-gnu-fips.tar.gz
#       the standard Linux build with the upstream FIPS module build of
#       AWS-LC as its crypto provider (cargo feature `fips`). Built only for
#       a vX.Y.0 tag, or by workflow_dispatch with the input `fips`
#   first-bite-<version>-aarch64-apple-darwin.tar.gz
#   first-bite-<version>-x86_64-apple-darwin.tar.gz
#   first-bite-<version>-x86_64-pc-windows-msvc.zip     bite.exe only
#   first-bite-<version>.spdx.json   SPDX 2.3 SBOM of the workspace
#   SHA256SUMS                       digest of every asset above
#   first-bite-<version>.intoto.jsonl
#       SLSA build provenance for every asset above: one signed in-toto
#       statement (a Sigstore bundle) whose subjects are the lines of
#       SHA256SUMS. Published while the repository is public
#
# Container image, the Dockerfile built for linux/amd64 and linux/arm64:
#   ghcr.io/<owner>/<repository>:<version>          both platforms
#   ghcr.io/<owner>/<repository>:<version>-amd64    one platform each
#   ghcr.io/<owner>/<repository>:<version>-arm64
#   ghcr.io/<owner>/<repository>:latest             moved by a release that is
#                                                   not a pre-release
#       with signed build provenance and the SPDX SBOM attested to the digest
#       of <version>, stored in the registry beside the image and as GitHub
#       artifact attestations, while the repository is public
#
# <version> is the tag without its `v` (tools/release-version.sh). The tag
# must be v<version of the mind crate>, or a pre-release of it such as
# v1.0.1-rc.1. A tag with a hyphen is a pre-release: its GitHub release is
# marked so, and it does not move `latest`.
#
# tools/package-release.sh lays out each archive; docs/deployment.md says which
# to choose. The build steps are make targets and scripts in tools/, the same
# ones a developer runs.
#
# The provenance is also recorded as a GitHub artifact attestation. Verify an
# asset against either copy, and the image:
#   gh attestation verify <file> --repo <owner>/<repo>
#   gh attestation verify <file> --repo <owner>/<repo> --bundle first-bite-<version>.intoto.jsonl
#   gh attestation verify oci://ghcr.io/<owner>/<repository>:<version> --repo <owner>/<repo>
#
# workflow_dispatch is the dry run: it builds, runs and packages everything,
# the image included, and publishes nothing, whatever ref it is run on.
#   gh workflow run release.yml --ref main -f static=true
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      static:
        description: also build the self-contained (static musl) Linux binaries
        type: boolean
        default: false
      fips:
        description: also build the Linux binaries with the FIPS module build of the crypto provider
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Built in an Ubuntu 20.04 container, then run in bare containers of every
  # Ubuntu release the binaries are published for.
  linux:
    name: build ${{ matrix.arch }}-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      PLATFORM: ${{ matrix.arch }}-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make portable
      - run: make portable-check
      - name: Package
        run: tools/package-release.sh "$PLATFORM" "$(make -s portable-dir)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-bite-${{ env.PLATFORM }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # The self-contained variant changes less often than the standard one: it
  # is built for the first release of a minor version, and on request.
  linux-static:
    name: build ${{ matrix.arch }}-linux-musl
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.static)
      || (github.ref_type == 'tag' && endsWith(github.ref_name, '.0')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      PLATFORM: ${{ matrix.arch }}-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make static
      - run: make static-check
      - name: Package
        run: tools/package-release.sh "$PLATFORM" "$(make -s static-dir)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-bite-${{ env.PLATFORM }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # The standard build with the cargo feature `fips`: the crypto provider is
  # the upstream FIPS module build of AWS-LC, linked statically. The check
  # also requires `mind security show` to report the module active. Built as
  # often as the self-contained variant.
  linux-fips:
    name: build ${{ matrix.arch }}-linux-gnu-fips
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.fips)
      || (github.ref_type == 'tag' && endsWith(github.ref_name, '.0')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      PLATFORM: ${{ matrix.arch }}-linux-gnu-fips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make portable-fips
      - run: make portable-fips-check
      - name: Package
        run: tools/package-release.sh "$PLATFORM" "$(make -s portable-fips-dir)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-bite-${{ env.PLATFORM }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # libpcap and the C++ runtime are part of macOS, so the ordinary release
  # build needs nothing added. Each binary is run on the runner that built it.
  macos:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (as rust-toolchain.toml)
        run: rustup toolchain install stable --no-self-update --profile minimal --target "$TARGET"
      - run: cargo build --release --locked --target "$TARGET" -p mind -p bite --features "$(make -s release-features)"
      - name: Shared libraries mind needs
        run: otool -L "target/$TARGET/release/mind"
      - run: tools/smoke-test.sh "target/$TARGET/release"
      - name: Package
        run: tools/package-release.sh "$TARGET" "target/$TARGET/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-bite-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # The dictionary tool is pure Rust and needs nothing on Windows.
  windows:
    name: build x86_64-pc-windows-msvc (bite)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (as rust-toolchain.toml)
        run: rustup toolchain install stable --no-self-update --profile minimal --target "$TARGET"
      - run: cargo build --release --locked --target "$TARGET" -p bite
      - run: tools/smoke-test.sh --bite-only "target/$TARGET/release"
      - name: Package
        run: tools/package-release.sh "$TARGET" "target/$TARGET/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-bite-${{ env.TARGET }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # mind on Windows links the Npcap SDK and needs Npcap installed to start.
  # Npcap cannot be installed unattended on a runner, so this job shows only
  # that mind compiles and links; the binary is kept as a workflow artifact
  # and is not part of the release. A failure here does not fail the release.
  # --no-default-features leaves out the object storage sinks and the C
  # cryptography library they bring.
  windows-mind:
    name: build x86_64-pc-windows-msvc (mind, not released)
    runs-on: windows-2025
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      NPCAP_SDK_VERSION: '1.17'
      NPCAP_SDK_SHA256: ab7e1a6cb8d07427e0071ec11be380bd9d2bb19ae6ab3f5ede0698c301638258
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (as rust-toolchain.toml)
        run: rustup toolchain install stable --no-self-update --profile minimal --target "$TARGET"
      - name: Npcap SDK
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL -o npcap-sdk.zip "https://npcap.com/dist/npcap-sdk-$NPCAP_SDK_VERSION.zip"
          echo "$NPCAP_SDK_SHA256  npcap-sdk.zip" | sha256sum --check
          7z x -bso0 -onpcap-sdk npcap-sdk.zip
          echo "LIBPCAP_LIBDIR=$(cygpath -w "$PWD/npcap-sdk/Lib/x64")" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target "$TARGET" -p mind --no-default-features
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unreleased-mind-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/mind.exe
          if-no-files-found: error
          retention-days: 30

  # The container image, built and run on a runner of each CPU. It is kept as
  # a workflow artifact; image-publish pushes it.
  image:
    name: build image linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE_NAME: first-bite:${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image
      - run: make image-check
      - name: Save
        run: docker save "$IMAGE_NAME" | gzip > "first-bite-image-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-linux-${{ matrix.arch }}
          path: first-bite-image-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  sbom:
    name: SPDX SBOM
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_SBOM_VERSION: '0.10.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (as rust-toolchain.toml)
        run: rustup toolchain install stable --no-self-update --profile minimal
      - name: cargo-sbom
        run: cargo install cargo-sbom --locked --version "=$CARGO_SBOM_VERSION"
      - name: Generate the SBOM
        run: |
          set -euo pipefail
          version="$(tools/release-version.sh)"
          mkdir -p dist
          cargo sbom --output-format spdx_json_2_3 > "dist/first-bite-$version.spdx.json"
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' "dist/first-bite-$version.spdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-bite-sbom
          path: dist/*.spdx.json
          if-no-files-found: error
          retention-days: 30

  # Pushes the images the `image` job built and joins them under one tag.
  # Runs no code from the repository, and waits for every build: nothing is
  # published unless all of the release was built and run.
  image-publish:
    name: publish the container image
    needs: [linux, linux-static, macos, windows, sbom, image]
    # linux-static is skipped for most tags; a skipped job must not skip this one.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-linux-*
          path: images
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: first-bite-sbom
          path: sbom
      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sources=()
          for arch in amd64 arm64; do
            docker load --input "images/first-bite-image-$arch.tar.gz"
            docker tag "first-bite:$arch" "$repository:$version-$arch"
            docker push "$repository:$version-$arch"
            sources+=("$repository:$version-$arch")
          done
          tags=(--tag "$repository:$version")
          case "$version" in *-*) ;; *) tags+=(--tag "$repository:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$repository:$version"
          digest="$(docker buildx imagetools inspect "$repository:$version" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $repository:$version"; exit 1 ;; esac
          {
            echo "repository=$repository"
            echo "digest=$digest"
            echo "sbom=sbom/first-bite-$version.spdx.json"
          } >> "$GITHUB_OUTPUT"
          echo "\`$repository:$version\` is \`$repository@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      # Artifact attestations on a private repository need GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record needs a further permission, artifact-metadata.
          create-storage-record: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ steps.push.outputs.sbom }}
          push-to-registry: true

  # Runs no code from the repository: it only checksums, attests and uploads
  # what the jobs above built. Last, so that a release is announced only when
  # its image is published.
  publish:
    name: publish the GitHub release
    needs: [linux, linux-static, linux-fips, macos, windows, sbom, image-publish]
    # linux-static and linux-fips are skipped for most tags; a skipped job
    # must not skip this one.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: first-bite-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.zip *.spdx.json > SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Artifact attestations on a private repository need GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/SHA256SUMS
      # The same attestation as a release asset, so it can be checked with the
      # file alone, and found by tools that look for provenance beside a
      # release (OpenSSF Scorecard's Signed-Releases check).
      - name: Provenance as a release asset
        if: ${{ steps.attest.outputs.bundle-path != '' }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jq -e -s 'length > 0 and all(.[]; .dsseEnvelope.payloadType == "application/vnd.in-toto+json")' "$BUNDLE" > /dev/null
          cp "$BUNDLE" "dist/first-bite-$version.intoto.jsonl"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
