# Build the documentation site (site/, docs/*.md, docs/img) and publish it to
# GitHub Pages. Deploys only while the repository is public.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'icon/**'
      - 'tools/build-site.py'
      - 'bite/**'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The interactive decoder is the bite decoder compiled to WebAssembly.
      # The step runs only when the Makefile has a wasm target.
      - name: Interactive decoder (make wasm)
        timeout-minutes: 20
        run: |
          if grep -q '^wasm:' Makefile; then
            make wasm
          else
            echo "no wasm target in the Makefile: building the site without the decoder"
          fi
      - name: Build the site
        run: make site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_build

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
