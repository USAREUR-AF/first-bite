# CodeQL static analysis of the Rust, Python and JavaScript sources and of the
# workflows. All four are extracted from source; nothing is built. The
# JavaScript is the two scripts of the published site: site/assets/landing.js
# and site/decoder/decoder.js. Both are written by hand and run in the
# visitor's browser.
name: codeql

on:
  # Every pull request and every push to main, whatever it changes: each
  # commit that reaches main then has an analysis, which is also what OpenSSF
  # Scorecard's SAST check counts. The four extractions take a few minutes.
  pull_request:
  # main keeps its own analysis: code scanning compares a pull request's alerts
  # against the default branch's.
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Code scanning on a private repository needs GitHub Code Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
