# RustSec advisory scan of Cargo.lock. The weekly run catches advisories
# published against dependencies that have not changed.
name: rust-audit

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'fuzz/Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/rust-audit.yml'
  # On main as well, so the badge in the README has a result for the branch.
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'fuzz/Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/rust-audit.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0
      # Fails on vulnerabilities; unmaintained-crate warnings are reported only.
      - run: cargo audit
      # The fuzz targets are their own workspace with their own lock file.
      - run: cargo audit --file fuzz/Cargo.lock
