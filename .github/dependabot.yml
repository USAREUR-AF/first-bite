version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # These share one `digest` release and only build when moved together.
      rustcrypto:
        patterns: ["hmac", "sha2", "digest"]
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to the version the goat fabric pins; moved by hand with it.
      - dependency-name: "zenoh"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # The fuzz targets are their own workspace with their own lock file.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
    groups:
      fuzz:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  # The base images in the Dockerfile, the fuzz builder image and the images
  # of the mocks are pinned by digest (tools/check-pins.py); these entries
  # move the pins.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/.clusterfuzzlite"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directories:
      - "/mocks/azure"
      - "/mocks/elastic"
      - "/mocks/s3"
    schedule:
      interval: weekly
      day: monday
    groups:
      mocks:
        patterns: ["*"]
    # The Elasticsearch mock stands in for the server the Filebeat example
    # ships to, and stays on the major version of FILEBEAT_VERSION in
    # deployment/filebeat/install.sh. Move both together, by hand.
    ignore:
      - dependency-name: "elasticsearch/elasticsearch"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
