version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # These share one `digest` release and only build when moved together.
      rustcrypto:
        patterns: ["hmac", "sha2", "digest"]
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to the version the goat fabric pins; moved by hand with it.
      - dependency-name: "zenoh"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
