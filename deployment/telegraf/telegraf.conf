# Telegraf configuration: CPU, memory, disk and network metrics of the host
# and the resource use of the first-bite service, to InfluxDB 2.
# install.sh replaces the example output URL with the one it is given.

[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  mount_points = ["/", "/var"]

[[inputs.net]]

# CPU, memory and file descriptors of the processes of first-bite.service.
[[inputs.procstat]]
  systemd_unit = "first-bite.service"

[[outputs.influxdb_v2]]
  urls = ["https://influxdb.example.org:8086"]
  # INFLUX_TOKEN is read from /etc/default/telegraf.
  token = "${INFLUX_TOKEN}"
  organization = "example-org"
  bucket = "first-bite"
