# A single-node Elasticsearch on 127.0.0.1:9200 with security off, for trying
# the Filebeat example in deployment/filebeat. Data is gone when the
# container is removed.
---
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
