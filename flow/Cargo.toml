[package]
name = "flow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "integrations for data egress of the first-bite application"
readme = "README.md"

[features]
default = []
# Each feature compiles one sink and the client library it needs.
azure = ["dep:base64", "dep:hex", "dep:hmac", "dep:sha2"]
aws = ["dep:aws-sdk-s3", "dep:hex", "dep:sha2"]
zenoh = ["dep:zenoh"]

[dependencies]
async-trait.workspace = true
aws-sdk-s3 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono.workspace = true
cotify.workspace = true
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
log.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
zenoh = { workspace = true, optional = true }
zmq.workspace = true
